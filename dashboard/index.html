<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Smart Water Tank Monitoring System - Real-time IoT monitoring, automated pump control, and water resource analytics." />
    <title>Smart Water Tank Monitoring System — Software Foundation</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body style="background: #090B10; margin: 0; padding: 0;">
    <div id="app">
      <div id="initial-loader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #090B10; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif; gap: 20px; padding: 20px; text-align: center;">
        <div style="width: 58px; height: 58px; border-radius: 18px; background: #131722; border: 1.5px solid rgba(212, 246, 61, 0.4); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 24px rgba(212, 246, 61, 0.25);">
          <img src="/favicon.svg" width="38" height="38" alt="Smart Water Tank" />
        </div>
        <div>
          <h1 style="font-size: 24px; font-weight: 800; letter-spacing: -0.5px; margin: 0 0 6px 0;">Smart Water Tank <span style="display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #D4F63D; vertical-align: middle;"></span></h1>
          <p style="font-size: 13px; color: #8A92A6; font-weight: 500; margin: 0;">Initializing Cloud Engine & Telemetry...</p>
        </div>
        <div style="width: 28px; height: 28px; border: 3px solid rgba(212, 246, 61, 0.15); border-top-color: #D4F63D; border-radius: 50%; animation: init-spin 0.8s linear infinite;"></div>
        <style>
          @keyframes init-spin { to { transform: rotate(360deg); } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
